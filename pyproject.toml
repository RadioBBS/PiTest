[project]
name = "testpi"
version = "1.0.0"
description = "Gibt Umgebungsdaten eines Linux-Rechners aus, speichert die IP-Adressen in einer zeitgestempelten Datei und prueft ein Sync-Verzeichnis."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "(FFHB) / RadioBBS" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/RadioBBS/PiTest"
Repository = "https://github.com/RadioBBS/PiTest"
